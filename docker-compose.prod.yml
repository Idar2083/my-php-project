x-app-production-environment: &app-production-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}

  DB_CONNECTION: ${DB_CONNECTION}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${MINIO_BUCKET}
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    environment:
      <<: *app-production-environment
    restart: unless-stopped
    volumes: !reset []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  report-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command:
      - /usr/local/bin/entrypoint.worker.sh
    environment:
      <<: *app-production-environment
    restart: unless-stopped
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  outbox-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          php artisan outbox:process
          sleep 60
        done
    environment:
      <<: *app-production-environment
    restart: unless-stopped
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  report-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command:
      - php
      - artisan
      - schedule:work
    environment:
      <<: *app-production-environment
    restart: unless-stopped
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes: !override
      - ./app/public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    ports: !reset []

  redis:
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports: !reset []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    ports: !reset []

  minio:
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    volumes:
      - minio_data_prod:/data
    ports: !reset []

volumes:
  pg_data_prod:
  rabbitmq_data_prod:
  minio_data_prod: