stages:
  - build
  - code-quality

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""

build:
  stage: build
  image: docker:latest
  script:
    - docker run --rm php:8.4-fpm php -r 'echo gethostbyname("pecl.php.net"), PHP_EOL;'
    - docker run --rm php:8.4-fpm php -r '$f=fopen("https://pecl.php.net/channel.xml","r"); var_dump($f !== false);'
    - docker build --target ci -f docker/php/Dockerfile -t pizza-backend-ci:latest .
    - docker build --target prod -f docker/php/Dockerfile -t pizza-backend:latest .

phpstan:
  stage: code-quality
  image: pizza-backend-ci:latest
  script:
    - cd /var/www/app
    - ./vendor/bin/phpstan analyse app routes config database

php-cs-fixer:
  stage: code-quality
  image: pizza-backend-ci:latest
  script:
    - cd /var/www/app
    - ./vendor/bin/php-cs-fixer fix --dry-run --diff

rector:
  stage: code-quality
  image: pizza-backend-ci:latest
  script:
    - cd /var/www/app
    - ./vendor/bin/rector process --dry-run

tests:
  stage: code-quality
  image: pizza-backend-ci:latest
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: rabbitmq:3.13-management-alpine
      alias: rabbitmq
    - name: minio/minio:latest
      alias: minio
      command:
        - server
        - /data

  variables:
    FF_NETWORK_PER_BUILD: "true"

    APP_ENV: testing

    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: pizza_app_test
    DB_USERNAME: pizza_db_user
    DB_PASSWORD: change_me_db_password

    POSTGRES_DB: pizza_app_test
    POSTGRES_USER: pizza_db_user
    POSTGRES_PASSWORD: change_me_db_password

    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: pizza_rabbitmq
    RABBITMQ_PASSWORD: change_me_rabbitmq_password
    RABBITMQ_DEFAULT_USER: pizza_rabbitmq
    RABBITMQ_DEFAULT_PASS: change_me_rabbitmq_password
    RABBITMQ_VHOST: /

    RABBITMQ_QUEUE: reports.generate
    RABBITMQ_REPORTS_EXCHANGE: reports
    RABBITMQ_REPORTS_GENERATE_QUEUE: reports.generate
    RABBITMQ_REPORTS_GENERATE_ROUTING_KEY: reports.generate
    RABBITMQ_REPORTS_DLQ_QUEUE: reports.generate.dlq
    RABBITMQ_REPORTS_DLQ_ROUTING_KEY: reports.generate.dlq
    RABBITMQ_REPORTS_COMPLETED_QUEUE: reports.completed
    RABBITMQ_REPORTS_COMPLETED_ROUTING_KEY: reports.completed

    MINIO_ROOT_USER: pizza_minio
    MINIO_ROOT_PASSWORD: change_me_minio_password

    AWS_ACCESS_KEY_ID: pizza_minio
    AWS_SECRET_ACCESS_KEY: change_me_minio_password
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: reports
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"

  script:
    - cd /var/www/app
    - export APP_KEY=$(php artisan key:generate --show)
    - php artisan jwt:secret --force
    - php artisan migrate --force
    - until php -r '$socket = @fsockopen("rabbitmq", 5672, $errno, $errstr, 1); if ($socket !== false) { fclose($socket); exit(0); } exit(1);'; do echo "Waiting for RabbitMQ..."; sleep 2; done
    - until curl -fsS http://minio:9000/minio/health/live; do echo "Waiting for MinIO..."; sleep 2; done
    - php -r '$client = new Aws\S3\S3Client(["version" => "latest", "region" => getenv("AWS_DEFAULT_REGION"), "endpoint" => getenv("AWS_ENDPOINT"), "credentials" => ["key" => getenv("AWS_ACCESS_KEY_ID"), "secret" => getenv("AWS_SECRET_ACCESS_KEY")], "use_path_style_endpoint" => true]); try { $client->headBucket(["Bucket" => getenv("AWS_BUCKET")]); } catch (\Aws\S3\Exception\S3Exception $e) { if ($e->getStatusCode() !== 404) { throw $e; } $client->createBucket(["Bucket" => getenv("AWS_BUCKET")]); }'
    - php artisan reports:rabbitmq:setup
    - php artisan test