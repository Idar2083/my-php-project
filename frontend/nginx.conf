server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;

    # Execute only the Laravel front controller; keep the original request URI.
    location = /api {
        include /etc/nginx/laravel-api.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/laravel-api.conf;
    }

    location = /up {
        include /etc/nginx/laravel-api.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(php|env|map)$ {
        return 404;
    }

    # Check the deny rules above before serving generated assets.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Missing static files must not return a successful SPA document.
    location ~* \.(html|js|mjs|css|json|txt|xml|webmanifest|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
